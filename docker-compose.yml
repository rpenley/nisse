services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: nisse
      POSTGRES_PASSWORD: nisse
      POSTGRES_DB: nisse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nisse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    environment:
      DATABASE_URL: postgres://nisse:nisse@postgres:5432/nisse
      REDIS_URL: redis://redis:6379/
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4242:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  cargo-registry:
  cargo-target:
